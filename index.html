<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartCampus — College Management Web Application</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet" />

  <!-- Stylesheet -->
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <div id="app">
    <!-- Sidebar Navigation -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="brand-icon">S</div>
        <div class="brand-title">SmartCampus</div>
      </div>

      <nav id="sidebar-nav-list" class="sidebar-nav">
        <!-- Injected via App.renderSidebar() -->
      </nav>

      <div class="sidebar-footer">
        <div class="user-card">
          <div class="user-avatar" id="user-avatar-initials">S</div>
          <div class="user-info">
            <div class="user-name" id="user-name-display">College Registrar</div>
            <div class="user-role-tag" id="user-role-display">ADMIN ROLE</div>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main Content Shell -->
    <div class="main-wrapper">
      <!-- Top Header Bar -->
      <header class="topbar">
        <div class="topbar-title">
          <h1 class="page-heading" id="page-heading-title">Institutional Overview Dashboard</h1>
        </div>

        <div class="topbar-actions">
          <!-- Persona Role Switcher -->
          <div class="role-switcher-container">
            <span class="role-switcher-label">Role Persona:</span>
            <select id="role-select-input" class="role-select">
              <option value="admin">Admin Mode</option>
              <option value="faculty">Faculty Mode</option>
              <option value="student">Student Mode</option>
            </select>
          </div>

          <button class="topbar-btn" onclick="SmartCampusStore.resetToSeed(); App.init(); App.toast('Reset store to default seed data', 'info');">
            🔄 Reset Seed Data
          </button>
        </div>
      </header>

      <!-- Viewport Area -->
      <main class="content-body" id="view-viewport">
        <!-- Injected dynamically by App.renderMainContent() -->
      </main>
    </div>
  </div>

  <!-- Modal Overlay -->
  <div class="modal-overlay" id="modal-overlay-el">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title" id="modal-title-text">SmartCampus Action</div>
        <button class="modal-close" onclick="App.closeModal()">✕</button>
      </div>
      <div class="modal-body" id="modal-body-container">
        <!-- Modal content injected dynamically -->
      </div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container" style="position: fixed; bottom: 24px; right: 24px; z-index: 2000; display: flex; flex-direction: column; gap: 8px;"></div>

  <!-- Application JavaScript Bundles -->
  <script src="js/store.js"></script>
  <script src="js/views/admin.js"></script>
  <script src="js/views/faculty.js"></script>
  <script src="js/views/student.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
